              "name": "What is a dealer documentation fee (doc fee)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A dealer documentation fee is charged by car dealerships to process buyer sales contracts, state title transfers, and registration. Certain states cap doc fees by law (e.g., California caps at $85, New York at $175, and Minnesota at $125), whereas unregulated states like Florida and Colorado often feature dealer fees exceeding $995 to $1,400."
              }
            },
            {
              "@type": "Question",
              "name": "Are dealer add-on fees negotiable?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Dealer-installed accessories such as nitrogen tires, paint sealant, ceramic protection, fabric guard, and VIN glass etching carry 80% to 90% profit margins and are legally optional. CarMatrix provides itemized counter-negotiation language to remove unauthorized dealer add-ons."

            },

              "name": "How does CarMatrix verify vehicle recall information?",
